[project]
name = "azarovo-martingale"
version = "0.1.0"
description = "Martingale choice of the monitoring interval for VM memory: Azuma-Hoeffding intervals with risk delta, anytime-valid growth detectors (Ville), a joint scheduler, and log analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andrey Ferubko", email = "ferubko1999@yandex.ru" },
]
requires-python = ">=3.11"
keywords = [
    "martingale",
    "test-martingale",
    "anytime-valid",
    "ville-inequality",
    "change-detection",
    "cusum",
    "azuma-hoeffding",
    "virtual-machines",
    "kvm",
    "memory-management",
    "monitoring",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# The core is standard library only: it runs inside a hypervisor control loop.
dependencies = []

[project.optional-dependencies]
# Only the trace plots of the log analysis need these.
plot = [
    "matplotlib>=3.9",
    "numpy>=1.26",
]

[project.scripts]
azarovo-martingale = "azarovo_martingale.cli:main"

[project.urls]
Homepage = "https://github.com/89605502155/azarovo-martingale"
Documentation = "https://github.com/89605502155/azarovo-martingale/tree/main/docs"
Repository = "https://github.com/89605502155/azarovo-martingale"
Issues = "https://github.com/89605502155/azarovo-martingale/issues"
Changelog = "https://github.com/89605502155/azarovo-martingale/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "mypy>=2.4.0",
    "numpy>=1.26",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv.build-backend]
# The source distribution also carries the tests, documentation and examples.
source-include = [
    "tests/**",
    "docs/**",
    "examples/**",
    "scripts/**",
    "conftest.py",
    "README.ru.md",
    "CHANGELOG.md",
    "CITATION.cff",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle (numpy convention)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "EM",   # flake8-errmsg
    "ISC",  # implicit string concatenation
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ARG",  # unused arguments
    "PTH",  # pathlib
    "PGH",  # pygrep hooks
    "T20",  # no print in the library
    "PERF", # performance anti-patterns
    "FURB", # refurb
    "NPY",  # NumPy-specific rules
    "PL",   # pylint
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit (security)
]
ignore = [
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many arguments: the API mirrors the notation of the article
    "PLR0917", # too many positional arguments: the same
    "PLR0915", # too many statements
    "PLR2004", # magic values: the constants are those of the article
    "PLC0415", # imports inside functions keep optional dependencies optional
]
# Greek letters and mathematical signs in docstrings are formulas, not typos.
allowed-confusables = ["α", "β", "δ", "λ", "ν", "ρ", "σ", "γ", "ℓ", "×", "−", "–", "θ", "η", "κ", "ξ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D", "S101", "S311", "PLR2004", "PLR0917", "T20", "N802", "N803", "N806", "PERF", "PT011", "ARG001",
    "RUF001", "RUF002", "RUF003",  # Cyrillic and Greek text of the article in the tests
    # S311: seeded pseudo-random generators make the Monte Carlo tests reproducible
]
"examples/**" = ["D", "T20", "S101", "S311", "INP001"]
"conftest.py" = ["D"]
"experiments/**" = ["D", "T20", "S311", "INP001", "ARG001"]  # heavy scripts, not run in CI
"scripts/**" = ["D", "T20", "INP001", "S603", "S607", "PTH123"]  # git calls
"src/azarovo_martingale/cli.py" = ["T20"]  # the command-line tool prints its report

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["azarovo_martingale"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
    "--import-mode=importlib",
    "-m",
    "not slow",
]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS", "NUMBER"]
markers = [
    "slow: Monte Carlo studies; run with -m slow",
]
filterwarnings = [
    "error",
]

[tool.mypy]
python_version = "3.11"
files = ["src/azarovo_martingale"]
strict = true
warn_unreachable = true
